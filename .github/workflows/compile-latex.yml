name: Compilar LaTeX

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:    
jobs:
  build_pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Compilar documento
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Compilers_Proyect_Report.tex

      - name: Guardar PDF generado
        uses: actions/upload-artifact@v4
        with:
          name: documento-pdf
          path: Compilers_Proyect_Report.pdf     