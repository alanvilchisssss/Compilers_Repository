name: Compilar Reporte LaTeX

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Documentation/Reporte#2/**'
  workflow_dispatch:

jobs:
  build_pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Compilar documento LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: unam.gp5.tex
          working_directory: 'Documentation/Reporte#2'

      - name: Subir PDF generado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: unam.gp5
          path: 'Documentation/Reporte#2/unam.gp5.pdf'